<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển Hướng - Xem Tử Vi</title>
  <script>
    (function() {
      var hash = window.location.hash || '';
      var target = "XEM TỬ VI & XÔNG ĐẤT ĐẦU NĂM/index.html";
      if (hash.indexOf('hang-ngay') !== -1 || hash.indexOf('tu-vi-theo-ngay') !== -1) {
        target += "#tu-vi-theo-ngay";
      } else if (hash.indexOf('hang-thang') !== -1 || hash.indexOf('tu-vi-theo-thang') !== -1) {
        target += "#tu-vi-theo-thang";
      } else if (hash.indexOf('xong-dat') !== -1) {
        target += "#xong-dat-dau-nam";
      } else if (hash.indexOf('can-xuong') !== -1) {
        target += "#can-xuong-doan-so";
      } else {
        target += "#tu-vi-dau-nam";
      }
      window.location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=XEM TỬ VI & XÔNG ĐẤT ĐẦU NĂM/index.html">
</head>
